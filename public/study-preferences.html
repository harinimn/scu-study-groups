<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Group Preferences • SCU Study Groups</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbarLeft">
        <a class="backBtn" href="dashboard.html" aria-label="Back to dashboard">←</a>
        <div class="brandIcon">👥</div>
        <div>
          <div class="brandTitle">Study Group Preferences</div>
          <div class="brandSub">Set your study preferences for each class</div>
        </div>
      </div>
      <div class="topbarRight">
        <div class="avatar">AN</div>
      </div>
    </header>

    <main class="prefsPage">
      <div class="prefsWrap">
        <section class="card">
          <div class="cardHeader">
            <div>
              <div class="cardTitle">My Classes</div>
              <div class="cardSub">Configure study preferences for each of your classes</div>
            </div>
          </div>

          <div class="miniNote" id="classesStatus">Loading your classes…</div>
          <div class="accordion" id="classesAccordion"></div>
        </section>

        <div class="backWrap">
          <a class="backDash" href="dashboard.html">Back to Dashboard</a>
        </div>
      </div>
    </main>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="study-preferences.js"></script>
  </body>
</html>
