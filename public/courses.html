<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses • SCU Study Groups</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbarLeft">
        <a class="backBtn" href="dashboard.html" aria-label="Back to dashboard">←</a>
        <div class="brandIcon">🎓</div>
        <div>
          <div class="brandTitle">My Courses</div>
          <div class="brandSub">Manage your classes and find classmates</div>
        </div>
      </div>

      <div class="topbarRight">
        <div class="avatar">AN</div>
      </div>
    </header>

    <main class="coursesPage">
      <div class="coursesWrap">
        <!-- Quarter card -->
        <section class="card quarterCard">
          <button class="ghostBtn" id="prevQuarterBtn" type="button">‹ <span>Previous</span></button>

          <div class="quarterCenter">
            <div class="quarterTitle" id="quarterTitle">Winter 2026</div>
            <div class="quarterSub">Academic Quarter</div>
          </div>

          <button class="ghostBtn" id="nextQuarterBtn" type="button"><span>Next</span> ›</button>
        </section>

        <!-- Add course -->
        <button class="bigAddBtn" id="addCourseBtn" type="button">＋ Add Course</button>

        <!-- Courses list -->
        <section class="card">
          <div class="cardHeader">
            <div class="cardTitle">Your Courses</div>
            <div class="cardSub">View classmates and manage course visibility</div>
          </div>

          <div class="courseList" id="courseList"></div>
        </section>
      </div>

      <!-- Add Course Modal -->
      <div class="modalBackdrop" id="modalBackdrop" aria-hidden="true">
        <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modalHeader">
            <div>
              <div class="modalTitle" id="modalTitle">Add a course</div>
              <div class="modalSub">Choose a course + section for this quarter</div>
            </div>
            <button class="iconBtn" id="closeModalBtn" type="button" aria-label="Close">✕</button>
          </div>

          <div class="modalBody">
            <label class="label small" for="courseCodeInput">Course Code</label>
            <input id="courseCodeInput" class="textInput" placeholder="e.g., CSCI 61" />

            <label class="label small" for="courseNameInput" style="margin-top:12px;">Course Name</label>
            <input id="courseNameInput" class="textInput" placeholder="e.g., Data Structures" />

            <label class="label small" for="sectionInput" style="margin-top:12px;">Section</label>
            <input id="sectionInput" class="textInput" placeholder="e.g., 01" />
          </div>

          <div class="modalFooter">
            <button class="ghostBtn" id="cancelAddBtn" type="button">Cancel</button>
            <button class="primaryBtn" id="confirmAddBtn" type="button">Add Course</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="courses.js"></script>
  </body>
</html>
